version: '3.8'

services:
  frontend:
    build:
      context: ./client
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_AI_API_URL=http://localhost:8000
    depends_on:
      - backend
      - ai-sidecar

  backend:
    build:
      context: ./server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_CREATION_SECRET=${ADMIN_CREATION_SECRET}
      - VITE_AI_API_URL=http://ai-sidecar:8000
      - API_BASE_URL=http://localhost:5000
      - SOCKET_URL=http://localhost:5000
      - FRONTEND_URL=http://localhost
      - LOG_LEVEL=warn
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RATE_LIMIT_WINDOW=300000
      - RATE_LIMIT_MAX=50
      - ADMIN_EMAIL=admin@careergrid.com
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      - ai-sidecar
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ai-sidecar:
    build:
      context: ./ai-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
